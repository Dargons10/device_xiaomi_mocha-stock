# nvcamera.conf - Configuración del framework NVIDIA (LEGACY)
# Nuestro HAL3 (MochaCameraHAL.cpp) NO usa este archivo.
# Dejamos las rutas actualizadas para referencia en caso de debug.
# El HAL3 abre /dev/video0 y /dev/video1 directamente via V4L2.
version=1
camera0=/dev/video0,back,0,mono   // Back camera (IMX179 via tegra-vi V4L2)
camera1=/dev/video1,front,270,mono   // Front camera (OV5693 via tegra-vi V4L2)
